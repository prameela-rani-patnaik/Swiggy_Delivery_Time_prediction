name: CI-CD

on:
  push:

jobs:
  CI-CD:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Code Checkout
        uses: actions/checkout@v4

      # 2. Debug Model URI
      - name: Debug Model URI
        run: |
          echo "Current commit:"
          git rev-parse HEAD

          echo "Current branch:"
          git branch --show-current

          echo "run_information.json:"
          cat run_information.json

      # 3. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 4. Install dependencies
      - name: Install Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 5. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # 6. Pull DVC data
      - name: DVC Pull
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc pull --force

      # 7. Test Model Registry
      - name: Test Model Registry
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          pytest tests/test_model_registry.py

      # 8. Test Model Performance
      - name: Test Model Performance
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          pytest tests/test_model_perf.py

      # 9. Promote Model
      - name: Promote Model
        if: success()
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          # python scripts/promote_model_to_prod.py
          echo "Model promotion skipped"

      # 10. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 11. Build Docker image
      - name: Build Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: latest
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" .

      # 12. Push Docker image
      - name: Push Docker Image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: latest
        run: |
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"